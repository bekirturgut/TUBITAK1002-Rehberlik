name: Signed iOS App Store archive
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example 2.0.0)'
        required: true
        default: '2.0.0'
permissions:
  contents: read
concurrency:
  group: signed-ios-${{ github.ref }}
  cancel-in-progress: false
jobs:
  archive:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate signing prerequisites and version
        env:
          P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_APPSTORE_PROFILE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os,re,sys
          names=['APPLE_TEAM_ID','P12_BASE64','P12_PASSWORD','PROFILE_BASE64']
          missing=[name for name in names if not os.environ.get(name)]
          if missing: sys.exit('Apple membership/signing setup is incomplete. Missing: '+', '.join(missing))
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+',os.environ['RELEASE_VERSION']):
              sys.exit('Release version must use major.minor.patch.')
          PY
          xcodebuild -version
          python3 - <<'PY'
          import subprocess,sys
          sdk=subprocess.check_output(['xcrun','--sdk','iphoneos','--show-sdk-version'],text=True).strip()
          if int(sdk.split('.')[0]) < 26: sys.exit('App Store uploads require iOS 26 SDK or later.')
          PY
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd native-ios
          xcodegen generate
      - name: Install distribution certificate and profile
        env:
          P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_APPSTORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import base64,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          for name,filename in [('P12_BASE64','distribution.p12'),('PROFILE_BASE64','distribution.mobileprovision')]:
              (root/filename).write_bytes(base64.b64decode(os.environ[name],validate=True))
          PY
          security cms -D -i "$RUNNER_TEMP/distribution.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          python3 native-ios/scripts/prepare-signing.py "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/ExportOptions.plist"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          KEYCHAIN_PATH="$RUNNER_TEMP/distribution.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/distribution.p12" -P "$P12_PASSWORD" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          PROFILE_UUID=$(python3 -c 'import plistlib,os; print(plistlib.load(open(os.environ["RUNNER_TEMP"]+"/profile.plist","rb"))["UUID"])')
          cp "$RUNNER_TEMP/distribution.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          cp "$RUNNER_TEMP/distribution.mobileprovision" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
      - name: Archive and export signed IPA
        run: |
          set -euo pipefail
          xcodebuild archive -project native-ios/Rehberlik.xcodeproj -scheme Rehberlik -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Rehberlik.xcarchive" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' PROVISIONING_PROFILE_SPECIFIER="$APPLE_PROFILE_UUID" MARKETING_VERSION="$RELEASE_VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Rehberlik.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath native-ios/Distribution
          codesign --verify --deep --strict "$RUNNER_TEMP/Rehberlik.xcarchive/Products/Applications/Rehberlik.app"
      - uses: actions/upload-artifact@v4
        with:
          name: signed-ios-${{ inputs.version }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: native-ios/Distribution/*.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/distribution.keychain-db" 2>/dev/null || true
          if [ -n "${APPLE_PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$APPLE_PROFILE_UUID.mobileprovision" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$APPLE_PROFILE_UUID.mobileprovision"
          fi
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/distribution.mobileprovision" "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/ExportOptions.plist"
