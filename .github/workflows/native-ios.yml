name: Native Swift iOS
on:
  push:
    branches: ['migration/**']
  pull_request:
    paths: ['native-ios/**', 'functions/**', 'firestore*', '.github/workflows/native-ios.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
        working-directory: functions
      - run: node --test functions/test/legacy-contract.test.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: node functions/scripts/prepare-emulator.js
      - name: Legacy data flow integration tests
        run: npx --yes firebase-tools@15.30.0 emulators:exec --config firebase.legacy-tests.json --only firestore,functions --project demo-rehberlik 'GCLOUD_PROJECT=demo-rehberlik FIRESTORE_EMULATOR_HOST=127.0.0.1:8080 node functions/scripts/seed-emulator.js --reset && GCLOUD_PROJECT=demo-rehberlik FIRESTORE_EMULATOR_HOST=127.0.0.1:8080 node functions/scripts/check-emulator.js'
  swift-ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Xcode version
        run: xcodebuild -version
      - name: Core tests
        run: swift test --package-path native-ios/Core
      - name: Parse Swift sources
        run: swiftc -frontend -parse native-ios/App/*.swift
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Start isolated Firebase services for native end-to-end tests
        run: |
          npm ci --prefix functions
          node functions/scripts/prepare-emulator.js
          FUNCTIONS_DISCOVERY_TIMEOUT=120 npx --yes firebase-tools@15.30.0 emulators:start --config firebase.legacy-tests.json --only firestore,functions --project demo-rehberlik > native-ios/emulator.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4400/emulators | python3 -c 'import json,sys; d=json.load(sys.stdin); assert all(k in d for k in ["firestore","functions"])' 2>/dev/null; then break; fi
            sleep 2
          done
          GCLOUD_PROJECT=demo-rehberlik FIRESTORE_EMULATOR_HOST=127.0.0.1:8080 node functions/scripts/seed-emulator.js
          GCLOUD_PROJECT=demo-rehberlik FIRESTORE_EMULATOR_HOST=127.0.0.1:8080 node functions/scripts/check-emulator.js
          GCLOUD_PROJECT=demo-rehberlik FIRESTORE_EMULATOR_HOST=127.0.0.1:8080 node functions/scripts/seed-emulator.js --reset
      - name: Generate native project
        run: |
          brew install xcodegen
          cd native-ios
          xcodegen generate
      - uses: actions/cache/restore@v4
        id: xcode-cache
        with:
          path: native-ios/DerivedData
          key: native-ios-${{ runner.os }}-${{ runner.arch }}-xcode16.4-${{ hashFiles('native-ios/project.yml') }}
          restore-keys: native-ios-${{ runner.os }}-${{ runner.arch }}-xcode16.4-
      - name: iOS simulator build and tests
        timeout-minutes: 20
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for k,vs in d["devices"].items() if "iOS" in k for v in vs if "iPhone" in v["name"]))')
          xcodebuild test -jobs 2 -parallel-testing-enabled NO -project native-ios/Rehberlik.xcodeproj -scheme Rehberlik -derivedDataPath native-ios/DerivedData -destination "platform=iOS Simulator,id=$DEVICE" -resultBundlePath native-ios/TestResults.xcresult CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO RUN_FIREBASE_UI_TESTS=1 | tee native-ios/build.log
      - name: Unsigned device build
        run: xcodebuild build -project native-ios/Rehberlik.xcodeproj -scheme Rehberlik -derivedDataPath native-ios/DerivedData -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO
      - name: Export simulator screenshots
        if: always()
        run: |
          if [ -d native-ios/TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path native-ios/TestResults.xcresult --output-path native-ios/Screenshots
            xcrun xcresulttool export diagnostics --path native-ios/TestResults.xcresult --output-path native-ios/Diagnostics
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ios-test-results
          path: |
            native-ios/TestResults.xcresult
            native-ios/build.log
            native-ios/Screenshots
            native-ios/Diagnostics
            native-ios/emulator.log
      - uses: actions/cache/save@v4
        if: always() && !cancelled() && steps.xcode-cache.outputs.cache-hit != 'true'
        with:
          path: native-ios/DerivedData
          key: native-ios-${{ runner.os }}-${{ runner.arch }}-xcode16.4-${{ hashFiles('native-ios/project.yml') }}
